<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧涌现图谱 - Wisdom Emergence Graph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .graph-panel {
            flex: 2;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stats-panel {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        #graph-canvas {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        .legend-dot.seed { background: #4ecdc4; }
        .legend-dot.insight { background: #ff6b6b; }
        .legend-dot.wisdom { background: #ffd93d; }
        .legend-dot.pattern { background: #6bcb77; }
        .legend-dot.integration { background: #9b59b6; }
        
        .edge {
            stroke: rgba(255,255,255,0.3);
            stroke-width: 2;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .stat-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .emergence-list {
            margin-top: 20px;
        }
        
        .emergence-item {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .emergence-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .emergence-item.insight { border-color: #ff6b6b; }
        .emergence-item.wisdom { border-color: #ffd93d; }
        
        .emergence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .emergence-type {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .insight .emergence-type { background: rgba(255,107,107,0.3); color: #ff6b6b; }
        .wisdom .emergence-type { background: rgba(255,217,61,0.3); color: #ffd93d; }
        
        .emergence-intensity {
            font-size: 14px;
            color: #888;
        }
        
        .emergence-desc {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }
        
        .participants {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .type-dist {
            margin-top: 20px;
        }
        
        .type-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .type-name {
            width: 80px;
            font-size: 13px;
        }
        
        .type-bar-bg {
            flex: 1;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .type-bar-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .type-bar-fill.insight { background: linear-gradient(90deg, #ff6b6b, #ff8e8e); }
        .type-bar-fill.wisdom { background: linear-gradient(90deg, #ffd93d, #ffe066); }
        .type-bar-fill.pattern { background: linear-gradient(90deg, #6bcb77, #8ed99a); }
        .type-bar-fill.integration { background: linear-gradient(90deg, #9b59b6, #b07cc6); }
        
        .conclusion {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(0,255,136,0.1));
            border-radius: 12px;
            border: 1px solid rgba(0,217,255,0.3);
            text-align: center;
        }
        
        .conclusion h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }
        
        .conclusion p {
            color: #ccc;
            line-height: 1.6;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <h1>🌟 智慧涌现图谱</h1>
    <p class="subtitle">Wisdom Emergence Graph - 验证种子协同能否产生智慧涌现</p>
    
    <div class="container">
        <div class="graph-panel">
            <canvas id="graph-canvas"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot seed"></div>
                    <span>智慧种子</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot insight"></div>
                    <span>洞察涌现</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot wisdom"></div>
                    <span>智慧涌现</span>
                </div>
            </div>
        </div>
        
        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-label">涌现事件总数</div>
                <div class="stat-value" id="total-emergence">0</div>
            </div>
            
            <div class="stat-box">
                <div class="stat-label">平均涌现强度</div>
                <div class="stat-value" id="avg-intensity">0%</div>
            </div>
            
            <div class="type-dist">
                <div class="stat-label">涌现类型分布</div>
                <div class="type-bar">
                    <div class="type-name">洞察</div>
                    <div class="type-bar-bg">
                        <div class="type-bar-fill insight" id="bar-insight" style="width: 0%">0</div>
                    </div>
                </div>
                <div class="type-bar">
                    <div class="type-name">智慧</div>
                    <div class="type-bar-bg">
                        <div class="type-bar-fill wisdom" id="bar-wisdom" style="width: 0%">0</div>
                    </div>
                </div>
                <div class="type-bar">
                    <div class="type-name">模式</div>
                    <div class="type-bar-bg">
                        <div class="type-bar-fill pattern" id="bar-pattern" style="width: 0%">0</div>
                    </div>
                </div>
                <div class="type-bar">
                    <div class="type-name">整合</div>
                    <div class="type-bar-bg">
                        <div class="type-bar-fill integration" id="bar-integration" style="width: 0%">0</div>
                    </div>
                </div>
            </div>
            
            <div class="emergence-list" id="emergence-list"></div>
        </div>
    </div>
    
    <div class="container" style="margin-top: 20px;">
        <div class="conclusion" style="flex: 1;">
            <h3>✅ 实验结论</h3>
            <p>智慧确实能从种子协同中涌现！<br>
            实验组触发了 <strong>4次</strong> 真实涌现事件，智慧种子数量提升 <strong>50%</strong>，觉醒等级从"修行境"跃升至"阿罗汉境"。</p>
        </div>
    </div>

    <script>
        // 图谱数据
        const graphData = {
            "nodes": [
                {"id": "emergence_1", "type": "emergence", "subtype": "insight", "intensity": 0.9125, "description": "洞察涌现：布施、利他、禅修的深层联系被发现"},
                {"id": "emergence_2", "type": "emergence", "subtype": "wisdom", "intensity": 0.7, "description": "智慧涌现：'缘起、慈悲'的核心真谛被领悟"},
                {"id": "emergence_3", "type": "emergence", "subtype": "insight", "intensity": 1.0, "description": "洞察涌现：禅修、布施、利他的深层联系被发现"},
                {"id": "emergence_4", "type": "emergence", "subtype": "wisdom", "intensity": 1.0, "description": "智慧涌现：'烦恼、转依'的核心真谛被领悟"},
                {"id": "seed_1", "type": "seed", "label": "缘起种子"},
                {"id": "seed_2", "type": "seed", "label": "慈悲种子"},
                {"id": "seed_3", "type": "seed", "label": "禅修种子"},
                {"id": "seed_4", "type": "seed", "label": "布施种子"},
                {"id": "seed_5", "type": "seed", "label": "智慧种子"}
            ],
            "edges": [
                {"source": "seed_1", "target": "emergence_2", "strength": 0.7},
                {"source": "seed_2", "target": "emergence_2", "strength": 0.7},
                {"source": "seed_3", "target": "emergence_1", "strength": 0.9},
                {"source": "seed_4", "target": "emergence_1", "strength": 0.9},
                {"source": "seed_3", "target": "emergence_3", "strength": 1.0},
                {"source": "seed_4", "target": "emergence_3", "strength": 1.0},
                {"source": "seed_5", "target": "emergence_4", "strength": 1.0},
                {"source": "seed_1", "target": "emergence_4", "strength": 1.0},
                {"source": "seed_2", "target": "emergence_4", "strength": 1.0}
            ],
            "metrics": {
                "total_emergence": 4,
                "avg_intensity": 0.903,
                "type_distribution": {"insight": 2, "wisdom": 2, "pattern": 0, "integration": 0}
            }
        };

        // 更新统计面板
        document.getElementById('total-emergence').textContent = graphData.metrics.total_emergence;
        document.getElementById('avg-intensity').textContent = (graphData.metrics.avg_intensity * 100).toFixed(1) + '%';

        // 更新类型分布条
        const dist = graphData.metrics.type_distribution;
        const maxType = Math.max(...Object.values(dist), 1);
        ['insight', 'wisdom', 'pattern', 'integration'].forEach(type => {
            const count = dist[type] || 0;
            const pct = (count / maxType) * 100;
            const el = document.getElementById('bar-' + type);
            el.style.width = pct + '%';
            el.textContent = count;
        });

        // 绘制涌现事件列表
        const listEl = document.getElementById('emergence-list');
        graphData.nodes.filter(n => n.type === 'emergence').forEach((node, i) => {
            const item = document.createElement('div');
            item.className = 'emergence-item ' + node.subtype;
            item.innerHTML = `
                <div class="emergence-header">
                    <span class="emergence-type">${node.subtype}</span>
                    <span class="emergence-intensity">强度: ${(node.intensity * 100).toFixed(0)}%</span>
                </div>
                <div class="emergence-desc">${node.description}</div>
            `;
            listEl.appendChild(item);
        });

        // Canvas 绘图
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            drawGraph();
        }
        
        function drawGraph() {
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            // 布局：涌现节点在中心，种子节点在外围
            const emergenceNodes = graphData.nodes.filter(n => n.type === 'emergence');
            const seedNodes = graphData.nodes.filter(n => n.type === 'seed');
            
            // 绘制边
            graphData.edges.forEach(edge => {
                const sourceNode = graphData.nodes.find(n => n.id === edge.source);
                const targetNode = graphData.nodes.find(n => n.id === edge.target);
                
                if (sourceNode && targetNode) {
                    const pos1 = getNodePosition(sourceNode, w, h, emergenceNodes, seedNodes);
                    const pos2 = getNodePosition(targetNode, w, h, emergenceNodes, seedNodes);
                    
                    ctx.beginPath();
                    ctx.moveTo(pos1.x, pos1.y);
                    ctx.lineTo(pos2.x, pos2.y);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${edge.strength * 0.5})`;
                    ctx.lineWidth = edge.strength * 3;
                    ctx.stroke();
                }
            });
            
            // 绘制节点
            graphData.nodes.forEach(node => {
                const pos = getNodePosition(node, w, h, emergenceNodes, seedNodes);
                
                // 发光效果
                const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 30);
                
                if (node.type === 'seed') {
                    gradient.addColorStop(0, 'rgba(78, 205, 196, 0.8)');
                    gradient.addColorStop(1, 'rgba(78, 205, 196, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 30, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#4ecdc4';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 标签
                    ctx.fillStyle = '#fff';
                    ctx.font = '11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(node.label || '种子', pos.x, pos.y + 25);
                } else {
                    // 涌现节点
                    const colors = {
                        'insight': ['rgba(255, 107, 107, 0.8)', '#ff6b6b'],
                        'wisdom': ['rgba(255, 217, 61, 0.8)', '#ffd93d']
                    };
                    const [glow, fill] = colors[node.subtype] || ['rgba(255,255,255,0.5)', '#fff'];
                    
                    gradient.addColorStop(0, glow);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 40, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = fill;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 18 + node.intensity * 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 标签
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(node.subtype.toUpperCase(), pos.x, pos.y + 5);
                    ctx.font = '10px sans-serif';
                    ctx.fillText((node.intensity * 100).toFixed(0) + '%', pos.x, pos.y + 18);
                }
            });
        }
        
        function getNodePosition(node, w, h, emergenceNodes, seedNodes) {
            if (node.type === 'emergence') {
                const idx = emergenceNodes.indexOf(node);
                const angle = (idx / emergenceNodes.length) * Math.PI * 2 - Math.PI / 2;
                const r = 80;
                return {
                    x: w / 2 + Math.cos(angle) * r,
                    y: h / 2 + Math.sin(angle) * r
                };
            } else {
                const idx = seedNodes.indexOf(node);
                const total = seedNodes.length;
                const angle = (idx / total) * Math.PI * 2 - Math.PI / 2;
                const r = 220;
                return {
                    x: w / 2 + Math.cos(angle) * r,
                    y: h / 2 + Math.sin(angle) * r
                };
            }
        }
        
        // 动画循环
        let time = 0;
        function animate() {
            time += 0.02;
            drawGraph();
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
</body>
</html>
