<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>儿童版中国哲学史 - 封面</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            font-family: 'FZXiaoBiaoSong-B05S', 'FangSong', 'STFangsong', 'Noto Sans CJK SC', sans-serif;
            background: linear-gradient(135deg, #FFB74D 0%, #FF9800 50%, #1565C0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            overflow: hidden;
        }
        
        .title-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 80%;
        }
        
        .main-title {
            font-size: 52px;
            font-weight: bold;
            color: #FF6B35;
            margin-bottom: 15px;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 36px;
            color: #1565C0;
            margin-bottom: 25px;
            line-height: 1.3;
        }
        
        .description {
            font-size: 22px;
            color: #333333;
            line-height: 1.5;
        }
        
        .age-range {
            font-size: 18px;
            color: #666666;
            margin-top: 20px;
            font-style: italic;
        }
        
        /* 打印优化 */
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1 class="main-title">儿童版中国哲学史</h1>
        <h2 class="subtitle">和古人一起想问题</h2>
        <div class="description">
            一本带你探索中国哲学智慧的探险手册
        </div>
        <div class="age-range">
            适合8-12岁的小小哲学家
        </div>
    </div>
</body>
</html>
